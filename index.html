<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halloween Hunt Clue</title>
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; background:#f4f2ed; color:#292d30; font-family:Arial, Helvetica, sans-serif;">

  <main style="width:100%; max-width:560px; box-sizing:border-box; padding:48px 32px; background:#ffffff; border:1px solid #dedbd4; border-radius:4px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.04);">

    <div style="width:48px; height:2px; margin:0 auto 32px; background:#9b3935;"></div>

    <p style="margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:clamp(17px, 4vw, 20px); line-height:1.9; letter-spacing:0.2px; color:#484b4b;">
      Where fallen heroes rest in stone,<br>
      And brave souls are remembered long.<br>
      Past ghostly shadows, through the night,<br>
      Run to the place of names held tight.<br>
      Where wreaths are laid and poppies stay,<br>
      Your next clue waits, now sprint away.
    </p>

    <div style="width:48px; height:2px; margin:32px auto 0; background:#9b3935;"></div>

  </main>

</body>
</html>
